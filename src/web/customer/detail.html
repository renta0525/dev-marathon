<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>顧客詳細</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"/>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">顧客詳細</h2>
    <table class="table table-bordered">
      <tbody id="customer-detail">
        <!-- 詳細情報がここに表示されます -->
      </tbody>
    </table>

    <!-- 更新フォーム（初期は非表示） -->
    <div id="update-form" class="mt-4" style="display: none;">
      <h4>顧客情報を編集</h4>
      <form id="edit-form">
        <div class="form-group">
          <label>会社名</label>
          <input type="text" class="form-control" name="company_name" required>
        </div>
        <div class="form-group">
          <label>業種</label>
          <input type="text" class="form-control" name="industry" required>
        </div>
        <div class="form-group">
          <label>連絡先</label>
          <input type="text" class="form-control" name="contact" required>
        </div>
        <div class="form-group">
          <label>所在地</label>
          <input type="text" class="form-control" name="location" required>
        </div>
        <button type="submit" class="btn btn-success">更新</button>
      </form>
    </div>

    <button id="delete-button" class="btn btn-danger mt-3">削除</button>
    <button id="edit-button" class="btn btn-primary mt-3 ml-2">編集</button>
    <a href="/customer/list.html" class="btn btn-secondary mt-3 ml-2">一覧に戻る</a>
  </div>

  <script type="module">
    import config from "../config.js";

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    let customerData = {};

    // 詳細取得
    fetch(`${config.apiUrl}/customers/${id}`)
      .then(response => response.json())
      .then(customer => {
        customerData = customer;
        const detail = document.getElementById("customer-detail");
        for (const key in customer) {
          const row = document.createElement("tr");
          row.innerHTML = `<th>${key}</th><td>${customer[key]}</td>`;
          detail.appendChild(row);
        }
        // フォームに初期値をセット
        const form = document.getElementById("edit-form");
        form.company_name.value = customer.company_name;
        form.industry.value = customer.industry;
        form.contact.value = customer.contact;
        form.location.value = customer.location;
      })
      .catch(err => {
        console.error(err);
        alert("顧客情報の取得に失敗しました。");
      });

    // 削除ボタン処理
    document.getElementById("delete-button").addEventListener("click", () => {
      if (confirm("本当に削除してもよろしいですか？")) {
        fetch(`${config.apiUrl}/customers/${id}`, {
          method: "DELETE"
        })
        .then(response => response.json())
        .then(result => {
          alert("削除が完了しました。");
          window.location.href = "/customer/list.html";
        })
        .catch(error => {
          console.error(error);
          alert("削除に失敗しました。");
        });
      }
    });

    // 編集ボタン処理
    document.getElementById("edit-button").addEventListener("click", () => {
      document.getElementById("update-form").style.display = "block";
    });

    // 更新処理
    document.getElementById("edit-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const updateData = Object.fromEntries(formData);

      fetch(`${config.apiUrl}/customers/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(updateData)
      })
      .then(response => response.json())
      .then(data => {
        alert("更新が完了しました。");
        location.reload(); // ページ再読み込み
      })
      .catch(err => {
        console.error(err);
        alert("更新に失敗しました。");
      });
    });
  </script>
</body>
</html>
